<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Hockey Stats">
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="90%">
      <stop offset="0" stop-color="#3b1580"/><stop offset=".5" stop-color="#1b0a38"/><stop offset="1" stop-color="#0b0616"/>
    </radialGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9f7aff"/><stop offset=".55" stop-color="#6d28d9"/><stop offset="1" stop-color="#3b0f7a"/>
    </linearGradient>
    <path id="jersey" d="M198 104L150 114L72 166L96 266L148 250L152 410Q256 432 360 410L364 250L416 266L440 166L362 114L314 104Q256 148 198 104Z"/>
    <clipPath id="clip"><use href="#jersey"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <g id="hs" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0 0V64M46 0V64M0 32H46M124 0H78V32H124V64H78"/>
    </g>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <ellipse cx="256" cy="440" rx="160" ry="22" fill="#7fe7ff" opacity=".3" filter="url(#soft)"/>

  <!-- chandail : épaisseur puis tissu -->
  <use href="#jersey" fill="#12062a" transform="translate(6 12)"/>
  <use href="#jersey" fill="url(#cloth)"/>

  <g clip-path="url(#clip)">
    <!-- bandes de manches -->
    <path d="M100 156L124 260M412 156L388 260" stroke="#fff" stroke-width="18"/>
    <path d="M128 150L150 252M384 150L362 252" stroke="#7fe7ff" stroke-width="7"/>
    <!-- bandes du bas -->
    <rect x="60" y="340" width="400" height="22" fill="#fff"/>
    <rect x="60" y="372" width="400" height="8" fill="#7fe7ff"/>
    <!-- pli et lumière -->
    <path d="M150 114L362 114L360 200Q256 170 152 200Z" fill="#fff" opacity=".08"/>
    <path d="M256 150V410" stroke="#000" stroke-width="2" opacity=".12"/>
  </g>

  <!-- col en V lacé -->
  <path d="M198 104Q256 148 314 104" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
  <path d="M236 132L256 168L276 132" fill="none" stroke="#7fe7ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- monogramme de poitrine : contour cyan, lettre blanche -->
  <g transform="translate(194 220)">
    <use href="#hs" stroke="#1a0838" stroke-width="30" transform="translate(3 5)"/>
    <use href="#hs" stroke="#7fe7ff" stroke-width="28"/>
    <use href="#hs" stroke="#fff" stroke-width="15"/>
  </g>
</svg>
